
name: Deploy Smart Village to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare frontend
        run: |
          test -f frontend/index.html || {
            echo "index.html tidak ditemukan!"
            exit 1
          }

          cp frontend/index.html frontend/404.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Smart Village to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Prepare frontend
        run: |
          cd frontend

          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"

          if [ "$REPO" = "$OWNER.github.io" ]; then
            BASE_PATH=""
          else
            BASE_PATH="/$REPO"
          fi

          python3 - <<'PY'
          import os
          import re

          base = os.environ.get("BASE_PATH", "/smart-village")

          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          html = re.sub(
              r'(["\'])/assets/',
              lambda m: m.group(1) + base + '/assets/',
              html
          )

          html = html.replace(
              '="/manifest.webmanifest',
              '="' + base + '/manifest.webmanifest'
          )

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)
          PY

          cp index.html 404.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
